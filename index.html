<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Night Alone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/story.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside id="hud">
    <header class="hud-head">
      <div class="hud-eyebrow">Heading</div>
      <div class="hud-compass">
        <span id="hud-heading">N</span>
        <span id="hud-degrees">000&deg;</span>
      </div>
      <div class="hud-stat">
        <span class="hud-stat-label">Airspeed</span>
        <span id="hud-speed">123</span><span class="hud-unit">mph</span>
      </div>
      <div class="hud-stat">
        <span class="hud-stat-label">Plasma</span>
        <span class="hud-shots" id="hud-shots"></span>
      </div>
      <div class="hud-stat">
        <span class="hud-stat-label">Knife Edge</span>
      </div>
      <div class="hud-meter"><div id="hud-knife"></div></div>
    </header>

    <!-- One row per action, keyboard binding and pad binding side by side. The
         pad column dims itself until a controller is actually connected. -->
    <ul class="hud-keys" id="hud-keys">
      <!-- Built at runtime from js/keymap.js. The bindings change with the
           control scheme, so a hand-written list here would be wrong for
           half of the players and stale for the rest. -->
    </ul>

    <footer class="hud-foot">
      <span id="hud-burst">Flat Out</span>
      <button id="hud-pad-tag" type="button" hidden>Find controller</button>
    </footer>
  </aside>

  <pre id="padmon" hidden></pre>

  <section id="padview" hidden></section>

  <section id="map" aria-hidden="true">
    <canvas id="map-canvas"></canvas>
    <div class="map-hint"><kbd>Tab</kbd> <kbd class="pad">Pad</kbd> <kbd class="pad shape">&#9711;</kbd> to close</div>
  </section>

  <section id="console">
    <header class="console-head">
      <span class="console-title">Master Control</span>
      <span class="console-hint">&#96; to close</span>
    </header>
    <div id="console-log"></div>
    <div class="console-prompt">
      <span class="console-caret">&rsaquo;</span>
      <input id="console-input" type="text" spellcheck="false" autocomplete="off"
             placeholder="type help">
    </div>
  </section>

  <script type="module" src="./js/boot.js"></script>
</body>
</html>
