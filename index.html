<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dragon Flying Prototype</title>

<style>
body { margin: 0; overflow: hidden; }
canvas { display: block; }
</style>

<!-- Tell the browser where "three" is -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>
<body>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(0, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

const loader = new GLTFLoader();

loader.load(
"./assets/models/dragon.glb",
(gltf) => {

const dragon = gltf.scene;

// rotate the dragon to face the other direction
dragon.rotation.y = Math.PI;

// optional: adjust position if needed
dragon.position.set(0, 0, 0);

scene.add(dragon);

},
undefined,
(error) => {
console.error(error);
}
);

function animate() {
requestAnimationFrame(animate);
renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
