<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Night Alone</title>
  <!-- Without this a phone lays the page out in a 980px virtual viewport and
       scales it down to fit: on a 390pt portrait screen that is a 0.4x zoom, so
       every control is at 40% of its designed size, the canvas is rendered at
       980px and resampled, and the page can be pinched and panned - which is
       what "he does not stay centred" was. It also made the steering stick
       useless: 52 CSS px to full deflection became 21 device px, so a resting
       thumb was already hard over.

       user-scalable=no is normally an accessibility mistake and here it is not
       negotiable: the whole page is one canvas with its own drag gestures and
       nothing on it is text you would want to zoom, so a pinch is only ever an
       accident that leaves the game off-centre with no way back. The in-game
       text has its own size settings instead.

       viewport-fit=cover plus the env(safe-area-inset-*) padding in style.css
       is what keeps the controls out from under a notch and a home bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1,
        maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <!-- Icons. All relative, because Pages serves this from a subpath and an
       absolute /favicon.ico would resolve to the top of the domain. The .ico
       carries 16, 32 and 48 for anything old enough to look for it by name
       rather than read these tags. Built by tools/make_icons.py from the game's
       own dragon — see the header there. -->
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icon/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icon/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0e18">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/story.css">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="./css/hud.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- The in-flight HUD. Instruments bottom-left, a compass tape across the
       top, and the controls in a panel of their own that folds away — they used
       to be one 392px card down the left edge of the screen, which is a lot of
       picture to give to a key list. Ids are what main.js writes to. -->
  <aside id="hud">
    <div class="hud-instr">
      <div class="hud-big">
        <span id="hud-speed">123</span><span class="hud-unit">mph</span>
      </div>
      <div class="hud-alt">
        <span class="hud-lbl">Alt</span><span id="hud-alt">0</span><span class="hud-unit">m</span>
      </div>
      <div class="hud-row">
        <span class="hud-lbl">Plasma</span>
        <span class="hud-shots" id="hud-shots"></span>
      </div>
      <div class="hud-row">
        <span class="hud-lbl">Edge</span>
        <div class="hud-meter"><div id="hud-knife"></div></div>
      </div>
      <div class="hud-foot">
        <span id="hud-burst">Flat Out</span>
        <button id="hud-pad-tag" type="button" hidden>Find controller</button>
      </div>
    </div>
  </aside>

  <div id="hud-compass" aria-hidden="true">
    <div class="tape"><div class="tape-strip" id="hud-tape"></div></div>
    <i class="tape-wp" id="hud-tape-wp"></i>
    <div class="readout"><span id="hud-heading">N</span><span id="hud-degrees">000&deg;</span></div>
  </div>

  <!-- One row per action, keyboard binding and pad binding side by side. Built
       at runtime from js/keymap.js, so it cannot disagree with the bindings. -->
  <aside id="hud-keys-panel" class="open">
    <header><span>Controls</span><span class="kp-hint"><kbd>/</kbd> hide</span></header>
    <ul class="hud-keys" id="hud-keys"></ul>
  </aside>

  <pre id="padmon" hidden></pre>

  <section id="padview" hidden></section>

  <section id="map" aria-hidden="true">
    <canvas id="map-canvas"></canvas>
    <div class="map-hint"><kbd>Tab</kbd> <kbd class="pad">Pad</kbd> <kbd class="pad shape">&#9711;</kbd> to close</div>
  </section>

  <section id="console">
    <header class="console-head">
      <span class="console-title">Master Control</span>
      <span class="console-hint">&#96; to close</span>
    </header>
    <div id="console-log"></div>
    <div class="console-prompt">
      <span class="console-caret">&rsaquo;</span>
      <input id="console-input" type="text" spellcheck="false" autocomplete="off"
             placeholder="type help">
    </div>
  </section>

  <script type="module" src="./js/boot.js"></script>
</body>
</html>
