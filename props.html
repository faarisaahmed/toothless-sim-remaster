<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Alone &mdash; prop viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #14171c; color: #cfd6de;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #wrap { display: flex; height: 100vh; }
  #list { width: 250px; flex: 0 0 250px; overflow-y: auto; padding: 10px 0 40px;
          background: #101317; border-right: 1px solid #232830; }
  #list h3 { margin: 16px 12px 4px; font-size: 11px; letter-spacing: .12em;
             text-transform: uppercase; color: #6f7b8a; }
  #list a { display: block; padding: 3px 12px; color: #b9c3ce; cursor: pointer;
            text-decoration: none; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; }
  #list a:hover { background: #1b212a; color: #fff; }
  #list a.on { background: #2b3646; color: #fff; }
  #view { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; }
  #info { position: absolute; left: 14px; top: 12px; pointer-events: none;
          text-shadow: 0 1px 3px #000; }
  #info b { color: #fff; font-size: 15px; }
  #info span { color: #8b96a4; }
  #bar { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px;
         color: #8b96a4; }
  #bar label { cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div id="wrap">
  <nav id="list"></nav>
  <div id="view">
    <div id="info"></div>
    <div id="bar">
      <label><input type="checkbox" id="wire"> wireframe</label>
      <label><input type="checkbox" id="vcol" checked> COLOR_0</label>
      <label><input type="checkbox" id="ref" checked> scale refs</label>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
// ---------------------------------------------------------------------------
// A dev viewer for assets/models/props. Read-only: it imports js/textures.js
// to surface the props exactly the way the engine will, and touches nothing
// else in the game. Not part of the build.
//
// It doubles as proof that the metre-scale UVs work: every slot below sets one
// `repeat` for the whole material and nothing is stretched per model.
// ---------------------------------------------------------------------------
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as T from "./js/textures.js";

const SLOTS = {
  wood:      () => T.material(T.wood({ planks: 6 }), { repeat: 0.45, roughness: 0.80 }),
  wood_dark: () => T.material(T.wood({ planks: 4, warm: 0.6 }),
                              { repeat: 0.55, roughness: 0.88, color: 0x8a6c4c }),
  stone:     () => T.material(T.stone(), { repeat: 0.22, roughness: 0.95 }),
  iron:      () => T.material(T.stone({ cols: 2, rows: 2 }),
                              { repeat: 0.30, roughness: 0.48, color: 0x767d88 }),
  rope:      () => T.material(T.fur({ tint: [152, 130, 86] }), { repeat: 1.4, roughness: 0.95 }),
  cloth:     () => T.material(T.parchment(), { repeat: 0.30, roughness: 0.92, color: 0xded8c6 }),
  hide:      () => T.material(T.fur({ tint: [106, 80, 56] }), { repeat: 0.9, roughness: 0.86 }),
  ember:     () => new THREE.MeshStandardMaterial({
                     color: 0x2a1408, emissive: 0xff5a12, emissiveIntensity: 2.2,
                     roughness: 0.7 }),
};
const mats = {};
for (const [k, make] of Object.entries(SLOTS)) {
  mats[k] = make();
  if (k === "iron") mats[k].metalness = 0.85;
  mats[k].vertexColors = true;
}

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2029);
scene.fog = new THREE.Fog(0x1b2029, 40, 160);

const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0x9fb6d4, 0x3a3128, 1.5));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.position.set(9, 16, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const c = sun.shadow.camera;
c.left = c.bottom = -18; c.right = c.top = 18; c.far = 70;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(70, 48).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x3b4048, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(80, 40, 0x55606e, 0x333a44);
grid.position.y = 0.002;
scene.add(grid);

// Scale references. The brief is emphatic about these numbers, so they are
// drawn rather than trusted: a Viking is 1.8 m and Toothless is 3.4 m nose to
// tail base, 4.2 m across the wings.
const refs = new THREE.Group();
const refMat = new THREE.MeshStandardMaterial({ color: 0x7f8b9b, roughness: 0.9 });
const viking = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 1.1, 4, 10), refMat);
viking.position.set(-2.2, 0.9, 2.2);
viking.castShadow = true;
refs.add(viking);
const dragon = new THREE.Box3Helper(new THREE.Box3(
  new THREE.Vector3(-2.1, 0, -1.7), new THREE.Vector3(2.1, 1.3, 1.7)), 0x6ad0a0);
refs.add(dragon);
scene.add(refs);

const loader = new GLTFLoader();
let current = null;

function surface(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const slot = o.material?.name;
    if (mats[slot]) o.material = mats[slot];
    else console.warn("no slot material for", slot, "on", o.name);
  });
}

async function show(file, meta) {
  if (current) scene.remove(current);
  const gltf = await loader.loadAsync("assets/models/props/" + file);
  current = gltf.scene;
  surface(current);
  scene.add(current);
  apply();

  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3());
  const ctr = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 0.6);
  controls.target.copy(ctr);
  camera.position.copy(ctr).add(new THREE.Vector3(r * 1.5, r * 1.0, r * 1.9));
  camera.near = r / 100; camera.far = r * 40 + 200;
  camera.updateProjectionMatrix();

  const nodes = [];
  current.traverse(o => { if (o.isMesh) nodes.push(o.name); });
  document.getElementById("info").innerHTML =
    `<b>${file}</b><br><span>${meta.tris} tris / ${meta.budget} &nbsp;&middot;&nbsp; ` +
    `${size.x.toFixed(2)} &times; ${size.y.toFixed(2)} &times; ${size.z.toFixed(2)} m` +
    `<br>${meta.slots.join(", ")}` +
    (nodes.length > 1 ? `<br>nodes: ${nodes.join(", ")}` : "") +
    `<br>${meta.note}</span>`;
}

function apply() {
  const wire = document.getElementById("wire").checked;
  const vcol = document.getElementById("vcol").checked;
  for (const m of Object.values(mats)) {
    m.wireframe = wire;
    m.vertexColors = vcol;
    m.needsUpdate = true;
  }
  refs.visible = document.getElementById("ref").checked;
}
for (const id of ["wire", "vcol", "ref"])
  document.getElementById(id).addEventListener("change", apply);

const GROUPS = [["rig_", "P0 &mdash; the rig"], ["stack_", "P1 &mdash; hollow stack"],
                ["berk_", "P2 &mdash; Berk"], ["", "P3 &mdash; sea and dressing"]];

const meta = await (await fetch("assets/models/props/_build_meta.json")).json();
const nav = document.getElementById("list");
const seen = new Set();
for (const [prefix, title] of GROUPS) {
  const names = Object.keys(meta).sort()
    .filter(n => !seen.has(n) && n.startsWith(prefix));
  if (!names.length) continue;
  nav.insertAdjacentHTML("beforeend", `<h3>${title}</h3>`);
  for (const n of names) {
    seen.add(n);
    const a = document.createElement("a");
    a.textContent = n.replace(".glb", "");
    a.onclick = () => {
      nav.querySelectorAll("a").forEach(x => x.classList.remove("on"));
      a.classList.add("on");
      show(n, meta[n]);
    };
    nav.appendChild(a);
  }
}
nav.querySelector("a").click();

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
